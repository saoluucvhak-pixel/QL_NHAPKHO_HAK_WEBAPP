name: Kiểm thử tự động
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cài Playwright + Chromium (cho kiểm thử giao diện)
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Chạy kiểm thử
        run: npm test
